name: Frontend CI/CD

on:
  push:
    branches:
      - develop
      - 'release/**'
    tags:
      - 'prod-*'

  pull_request:
    branches: [develop]

permissions:
  contents: read
  packages: write
  # packages: write → อนุญาตให้ push image ไป GHCR

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Node 22 = Active LTS (ตรงกับ Bitbucket Pipeline ที่ใช้ node:22.13.0-alpine)
          cache: "npm"
          # cache node_modules → npm ci ครั้งถัดไปเร็วขึ้น

      - name: Install dependencies
        run: npm ci
        # npm ci = clean install จาก package-lock.json (ห้ามแก้ lockfile)

      - name: Build
        run: npm run build
        # Build Next.js → สร้าง .next/
        # ถ้า build fail → workflow fail → ไม่ไป deploy

  deploy:
    name: Build, Push GHCR & Deploy
    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    environment: >-
      ${{
        github.ref_name == 'develop' && 'develop' ||
        startsWith(github.ref, 'refs/heads/release/') && 'staging' ||
        startsWith(github.ref, 'refs/tags/prod-') && 'production' ||
        'develop'
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "IMAGE_TAG=develop" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == release/* ]]; then
            echo "IMAGE_TAG=stage" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN → GitHub สร้างให้อัตโนมัติ ไม่ต้องตั้ง secret เพิ่ม

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.IMAGE_TAG }}
          # tag format: ghcr.io/username/keep-pay-frontend:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
